name: Windows browser smoke test (draft)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-browser-smoke.yml'
      - 'scripts/windows-browser-smoke.cjs'
  workflow_dispatch:
jobs:
  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright library
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Firefox browser on Windows
        if: matrix.browser == 'firefox'
        run: npx playwright install firefox
      - name: Exercise LIVE NFT gallery in Windows browser
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: node scripts/windows-browser-smoke.cjs
      - name: Keep Windows screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.browser }}-screenshots
          path: scripts/windows-browser-screenshots/
          if-no-files-found: ignore
